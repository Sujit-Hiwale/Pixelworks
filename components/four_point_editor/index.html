<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#303149}.frame{width:100%;display:flex;justify-content:center}canvas{max-width:100%;height:auto;touch-action:none;border-radius:10px;background:#f1f2f7}.help{margin:6px 2px;color:#6d6e80;font-size:12px}
</style></head><body>
<div class="frame"><canvas id="editor"></canvas></div><div class="help">Drag each numbered handle. The points are returned in image pixel coordinates.</div>
<script>
const canvas=document.getElementById('editor'),ctx=canvas.getContext('2d');let args=null,img=new Image(),corners=[],drag=-1,scale=1,lastReset='';
function send(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{corners:corners.map(p=>[p[0]/scale,p[1]/scale]),nonce:Date.now()},dataType:'json'},'*')}
function render(){if(!args||!img.complete)return;const maxW=Math.min(880,args.width||880,window.innerWidth-8),maxH=680;scale=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight,1);canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));ctx.drawImage(img,0,0,canvas.width,canvas.height);if(corners.length===4){ctx.beginPath();corners.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle='rgba(85,91,245,.16)';ctx.fill();ctx.strokeStyle='#555bf5';ctx.lineWidth=3;ctx.stroke();corners.forEach((p,i)=>{ctx.beginPath();ctx.arc(p[0],p[1],10,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#555bf5';ctx.stroke();ctx.fillStyle='#292a42';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),p[0],p[1])})}requestAnimationFrame(()=>parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:document.body.scrollHeight},'*'))}
function receive(e){if(!e.data||!e.data.isStreamlitMessage)return;if(e.data.type==='streamlit:render'){args=e.data;img.onload=()=>{const key=JSON.stringify([args.args.image,args.args.resetToken]);if(key!==lastReset){lastReset=key;const maxW=Math.min(880,args.args.maxWidth||880,window.innerWidth-8),maxH=680;scale=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight,1);corners=(args.args.corners||[]).map(p=>[p[0]*scale,p[1]*scale]);if(corners.length!==4)corners=[[canvas.width*.08,canvas.height*.08],[canvas.width*.92,canvas.height*.08],[canvas.width*.92,canvas.height*.92],[canvas.width*.08,canvas.height*.92]];render()}else render()};img.src='data:image/jpeg;base64,'+args.args.image;parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:window.innerHeight},'*')}}
window.addEventListener('message',receive);parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
function pos(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}
canvas.addEventListener('pointerdown',e=>{const p=pos(e);drag=corners.reduce((best,c,i)=>Math.hypot(c[0]-p[0],c[1]-p[1])<Math.hypot(corners[best][0]-p[0],corners[best][1]-p[1])?i:best,0);canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag<0)return;const p=pos(e);corners[drag]=[Math.max(0,Math.min(canvas.width-1,p[0])),Math.max(0,Math.min(canvas.height-1,p[1]))];render()});
canvas.addEventListener('pointerup',()=>{if(drag>=0){drag=-1;send()}});canvas.addEventListener('pointercancel',()=>drag=-1);window.addEventListener('resize',render);
</script></body></html>
